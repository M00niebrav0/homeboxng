<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Box body - top face -->
  <path d="M256 80 L416 170 L256 260 L96 170 Z" fill="url(#grad-accent)" />

  <!-- Box body - left face -->
  <path d="M96 170 L256 260 L256 420 L96 330 Z" fill="url(#grad-primary)" />

  <!-- Box body - right face -->
  <path d="M416 170 L256 260 L256 420 L416 330 Z" fill="url(#grad-dark)" />

  <!-- Box lid - left flap (slightly open) -->
  <path d="M256 80 L96 170 L96 148 L256 58 Z" fill="url(#grad-accent)" opacity="0.9" />

  <!-- Box lid - right flap (slightly open, lifted) -->
  <path d="M256 80 L416 170 L430 140 L270 50 Z" fill="url(#grad-primary)" opacity="0.85" />

  <!-- NG badge - bottom right of box -->
  <rect x="310" y="290" width="110" height="56" rx="8" fill="#ffffff" opacity="0.95" />
  <text x="365" y="327" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#4338ca" text-anchor="middle" dominant-baseline="middle">NG</text>

  <!-- Subtle edge highlights -->
  <path d="M256 80 L256 260" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />
  <path d="M256 260 L256 420" stroke="#ffffff" stroke-width="1" opacity="0.15" />
  <path d="M96 170 L256 260 L416 170" stroke="#ffffff" stroke-width="1.5" opacity="0.2" fill="none" />
</svg>
