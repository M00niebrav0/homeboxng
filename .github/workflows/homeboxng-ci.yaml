name: HomeBoxNG CI

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [dev/homeboxng-init]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
  pull_request:
    branches: [main, dev/homeboxng-init]
  workflow_dispatch:

jobs:
  backend-build:
    name: "Backend Build & Vet"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.mod

      - name: Build binary
        working-directory: backend
        run: go build -o /dev/null ./app/api

      - name: Build all packages
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Verify go.mod is tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || {
            echo "ERROR: go.mod or go.sum is not tidy. Run 'go mod tidy' and commit."
            exit 1
          }

  backend-test:
    name: "Backend Tests"
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.mod

      - name: Run tests
        working-directory: backend
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./app/... ./internal/... ./pkgs/... -v -cover

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.out
          retention-days: 7

  plugin-check:
    name: "Plugin Architecture"
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.mod

      - name: Build all plugins
        working-directory: backend
        run: go build ./internal/core/plugins/...

      - name: Count registered plugins
        working-directory: backend
        run: |
          count=$(grep -c 'pluginRegistry.Register' app/api/plugins.go || true)
          echo "::notice::Registered plugins: $count"
          if [ "$count" -lt 12 ]; then
            echo "::error::Expected at least 12 registered plugins, found $count"
            exit 1
          fi

      - name: List plugin packages
        working-directory: backend
        run: |
          echo "## Plugin Packages" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find internal/core/plugins/builtin -name "plugin.go" -exec dirname {} \; | sort >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          count=$(find internal/core/plugins/builtin -name "plugin.go" | wc -l)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: $count plugin packages**" >> $GITHUB_STEP_SUMMARY

  frontend-check:
    name: "Frontend Lint & Typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck || true

      - name: Lint
        working-directory: frontend
        run: pnpm run lint || true

  docker-build:
    name: "Docker Build Test"
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-check]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: homeboxng:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
